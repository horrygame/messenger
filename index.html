<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер с играми и ботами</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }
        
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Верхняя панель */
        #top-nav {
            background: #2d2d2d;
            border-bottom: 1px solid #404040;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .nav-tabs {
            display: flex;
            gap: 20px;
        }
        
        .nav-tab {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
            color: #aaa;
        }
        
        .nav-tab:hover {
            background: #404040;
            color: #fff;
        }
        
        .nav-tab.active {
            background: #007bff;
            color: white;
        }
        
        #user-menu {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        #username-display {
            font-weight: bold;
            color: #007bff;
        }
        
        #logout-btn {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        /* Основной контент */
        #main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        /* Боковая панель */
        #sidebar {
            width: 280px;
            background: #2d2d2d;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
        }
        
        #sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #404040;
        }
        
        #search-input {
            width: 100%;
            padding: 10px;
            background: #3d3d3d;
            border: 1px solid #4d4d4d;
            color: #fff;
            border-radius: 6px;
        }
        
        #sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .sidebar-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #363636;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .sidebar-item:hover {
            background: #404040;
        }
        
        .sidebar-item.selected {
            background: #007bff;
        }
        
        .item-name {
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .item-desc {
            font-size: 12px;
            color: #aaa;
        }
        
        /* Основная область */
        #content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }
        
        #content-header {
            padding: 20px;
            border-bottom: 1px solid #404040;
            font-size: 18px;
            font-weight: bold;
        }
        
        #content-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        /* Сообщения */
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            background: #2d2d2d;
            border-radius: 8px;
            max-width: 70%;
        }
        
        .message.sent {
            background: #007bff;
            margin-left: auto;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }
        
        .message.sent .message-header {
            color: #fff;
            opacity: 0.8;
        }
        
        /* Карточки игр */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .game-card:hover {
            transform: translateY(-2px);
            background: #363636;
        }
        
        .game-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #007bff;
        }
        
        .game-description {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .game-meta {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 12px;
        }
        
        /* Формы */
        .create-form {
            max-width: 500px;
            background: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: #3d3d3d;
            border: 1px solid #4d4d4d;
            color: #fff;
            border-radius: 4px;
        }
        
        .form-group textarea {
            height: 150px;
            font-family: monospace;
        }
        
        .btn {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        /* Экран входа */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        #auth-form {
            background: #2d2d2d;
            padding: 40px;
            border-radius: 10px;
            width: 300px;
        }
        
        #auth-form h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        
        #auth-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #3d3d3d;
            border: 1px solid #4d4d4d;
            color: #fff;
            border-radius: 4px;
        }
        
        .auth-buttons {
            display: flex;
            gap: 10px;
        }
        
        .auth-buttons button {
            flex: 1;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .auth-buttons button:last-child {
            background: #28a745;
        }
        
        #auth-error {
            color: #dc3545;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- Экран авторизации -->
    <div id="auth-screen">
        <div id="auth-form">
            <h2>Мессенджер</h2>
            <div id="auth-error"></div>
            <input type="text" id="auth-username" placeholder="Имя пользователя">
            <input type="password" id="auth-password" placeholder="Пароль">
            <div class="auth-buttons">
                <button onclick="login()">Войти</button>
                <button onclick="register()">Регистрация</button>
            </div>
        </div>
    </div>
    
    <!-- Основное приложение -->
    <div id="app" style="display: none;">
        <!-- Верхняя навигация -->
        <div id="top-nav">
            <div class="nav-tabs">
                <div class="nav-tab active" onclick="switchTab('chats')">Чаты</div>
                <div class="nav-tab" onclick="switchTab('channels')">Каналы</div>
                <div class="nav-tab" onclick="switchTab('games')">Игры</div>
                <div class="nav-tab" onclick="switchTab('bots')">Боты</div>
            </div>
            
            <div id="user-menu">
                <span id="username-display"></span>
                <button id="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>
        
        <!-- Основной контент -->
        <div id="main-content">
            <!-- Боковая панель -->
            <div id="sidebar">
                <div id="sidebar-header">
                    <input type="text" id="search-input" placeholder="Поиск..." oninput="search()">
                </div>
                <div id="sidebar-content"></div>
            </div>
            
            <!-- Основная область -->
            <div id="content-area">
                <div id="content-header"></div>
                <div id="content-body"></div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно создания игры -->
    <div class="modal" id="create-game-modal">
        <div class="modal-content">
            <h2>Создать игру</h2>
            <div class="create-form">
                <div class="form-group">
                    <label>Название игры</label>
                    <input type="text" id="game-name" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="game-description" placeholder="Опишите игру"></textarea>
                </div>
                <div class="form-group">
                    <label>Код игры (JavaScript)</label>
                    <textarea id="game-code" placeholder="// Ваш код игры"></textarea>
                </div>
                <div class="form-group">
                    <label>Тип игры</label>
                    <select id="game-type">
                        <option value="clicker">Кликер</option>
                        <option value="quiz">Викторина</option>
                        <option value="rpg">RPG</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
                <button class="btn" onclick="submitGame()">Отправить на проверку</button>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно создания бота -->
    <div class="modal" id="create-bot-modal">
        <div class="modal-content">
            <h2>Создать бота</h2>
            <div class="create-form">
                <div class="form-group">
                    <label>Имя бота</label>
                    <input type="text" id="bot-name" placeholder="Введите имя">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="bot-description" placeholder="Опишите бота"></textarea>
                </div>
                <div class="form-group">
                    <label>Код бота (JavaScript)</label>
                    <textarea id="bot-code" placeholder="// Код обработки команд
function onMessage(command, args, user) {
    // Ваша логика
    return 'Ответ бота';
}"></textarea>
                </div>
                <div class="form-group">
                    <label>Команды (через запятую)</label>
                    <input type="text" id="bot-commands" placeholder="/help, /info, /game">
                </div>
                <button class="btn" onclick="submitBot()">Отправить на проверку</button>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно создания канала -->
    <div class="modal" id="create-channel-modal">
        <div class="modal-content">
            <h2>Создать канал</h2>
            <div class="create-form">
                <div class="form-group">
                    <label>Название канала</label>
                    <input type="text" id="channel-name" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="channel-description" placeholder="Опишите канал"></textarea>
                </div>
                <div class="form-group">
                    <label>Тип</label>
                    <select id="channel-type">
                        <option value="public">Публичный</option>
                        <option value="private">Приватный</option>
                    </select>
                </div>
                <button class="btn" onclick="createChannel()">Создать</button>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        let currentUser = null;
        let currentTab = 'chats';
        let selectedItem = null;
        let games = [];
        let bots = [];
        let channels = [];
        
        // Проверка авторизации при загрузке
        async function checkAuth() {
            try {
                const response = await fetch('/api/me');
                const data = await response.json();
                
                if (data.user) {
                    currentUser = data.user;
                    document.getElementById('username-display').textContent = currentUser.username;
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    socket.emit('authenticate', currentUser.id);
                    loadTabContent();
                }
            } catch (error) {
                console.error('Ошибка проверки авторизации:', error);
            }
        }
        
        // Регистрация
        async function register() {
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    await checkAuth();
                } else {
                    document.getElementById('auth-error').textContent = data.error;
                }
            } catch (error) {
                document.getElementById('auth-error').textContent = 'Ошибка подключения';
            }
        }
        
        // Вход
        async function login() {
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    await checkAuth();
                } else {
                    document.getElementById('auth-error').textContent = data.error;
                }
            } catch (error) {
                document.getElementById('auth-error').textContent = 'Ошибка подключения';
            }
        }
        
        // Выход
        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }
        
        // Переключение вкладок
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            loadTabContent();
        }
        
        // Загрузка контента вкладки
        async function loadTabContent() {
            const sidebar = document.getElementById('sidebar-content');
            const header = document.getElementById('content-header');
            const body = document.getElementById('content-body');
            
            switch(currentTab) {
                case 'chats':
                    header.innerHTML = 'Личные сообщения';
                    sidebar.innerHTML = '<div class="sidebar-item" onclick="showUserSearch()"><div class="item-name">🔍 Поиск пользователей</div><div class="item-desc">Найти нового собеседника</div></div>';
                    body.innerHTML = '<div class="info-message">Выберите пользователя для начала чата</div>';
                    break;
                    
                case 'channels':
                    header.innerHTML = 'Каналы <button class="btn" style="margin-left: 20px;" onclick="openCreateChannel()">+ Создать</button>';
                    await loadChannels();
                    break;
                    
                case 'games':
                    header.innerHTML = 'Игры <button class="btn" style="margin-left: 20px;" onclick="openCreateGame()">+ Создать игру</button>';
                    await loadGames();
                    break;
                    
                case 'bots':
                    header.innerHTML = 'Боты <button class="btn" style="margin-left: 20px;" onclick="openCreateBot()">+ Создать бота</button>';
                    await loadBots();
                    break;
            }
        }
        
        // Поиск
        async function search() {
            const query = document.getElementById('search-input').value;
            
            if (currentTab === 'chats') {
                const response = await fetch(`/api/users/search?query=${query}`);
                const users = await response.json();
                
                const sidebar = document.getElementById('sidebar-content');
                sidebar.innerHTML = users.map(u => `
                    <div class="sidebar-item" onclick="startChat('${u.id}', '${u.username}')">
                        <div class="item-name">${u.username}</div>
                        <div class="item-desc">${u.online ? '🟢 Online' : '⚫ Offline'}</div>
                    </div>
                `).join('');
            }
        }
        
        // Загрузка игр
        async function loadGames() {
            const response = await fetch('/api/games');
            games = await response.json();
            
            const body = document.getElementById('content-body');
            body.innerHTML = `
                <div class="games-grid">
                    ${games.map(game => `
                        <div class="game-card" onclick="playGame('${game.id}')">
                            <div class="game-name">${game.name}</div>
                            <div class="game-description">${game.description}</div>
                            <div class="game-meta">
                                <span>👤 ${game.authorName}</span>
                                <span>🎮 ${game.plays} игр</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // Загрузка ботов
        async function loadBots() {
            const response = await fetch('/api/bots');
            bots = await response.json();
            
            const body = document.getElementById('content-body');
            body.innerHTML = `
                <div class="games-grid">
                    ${bots.map(bot => `
                        <div class="game-card" onclick="openBotChat('${bot.id}')">
                            <div class="game-name">🤖 ${bot.name}</div>
                            <div class="game-description">${bot.description}</div>
                            <div class="game-meta">
                                <span>👤 ${bot.authorName}</span>
                                <span>📝 ${bot.commands?.length || 0} команд</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // Загрузка каналов
        async function loadChannels() {
            const response = await fetch('/api/channels/my');
            channels = await response.json();
            
            const sidebar = document.getElementById('sidebar-content');
            sidebar.innerHTML = channels.map(c => `
                <div class="sidebar-item ${selectedItem === c.id ? 'selected' : ''}" onclick="selectChannel('${c.id}')">
                    <div class="item-name"># ${c.name}</div>
                    <div class="item-desc">${c.members.length} участников</div>
                </div>
            `).join('');
        }
        
        // Выбор канала
        async function selectChannel(channelId) {
            selectedItem = channelId;
            const channel = channels.find(c => c.id === channelId);
            
            document.getElementById('content-header').innerHTML = `# ${channel.name}`;
            
            const body = document.getElementById('content-body');
            body.innerHTML = `
                <div style="height: 100%; display: flex; flex-direction: column;">
                    <div id="channel-messages" style="flex: 1; overflow-y: auto; margin-bottom: 20px;">
                        ${channel.messages.map(m => `
                            <div class="message ${m.userId === currentUser.id ? 'sent' : ''}">
                                <div class="message-header">
                                    <span>${m.username}</span>
                                    <span>${new Date(m.timestamp).toLocaleTimeString()}</span>
                                </div>
                                <div>${m.text}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="channel-message-input" style="flex: 1; padding: 10px; background: #3d3d3d; border: 1px solid #4d4d4d; color: #fff; border-radius: 4px;" placeholder="Введите сообщение...">
                        <button class="btn" onclick="sendChannelMessage('${channelId}')">Отправить</button>
                    </div>
                </div>
            `;
            
            socket.emit('join-channel', channelId);
        }
        
        // Отправка сообщения в канал
        async function sendChannelMessage(channelId) {
            const input = document.getElementById('channel-message-input');
            const text = input.value;
            
            if (!text) return;
            
            const response = await fetch(`/api/channels/${channelId}/message`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            
            if (response.ok) {
                input.value = '';
            }
        }
        
        // Открытие модалки создания игры
        function openCreateGame() {
            document.getElementById('create-game-modal').classList.add('active');
        }
        
        // Отправка игры на проверку
        async function submitGame() {
            const game = {
                name: document.getElementById('game-name').value,
                description: document.getElementById('game-description').value,
                code: document.getElementById('game-code').value,
                type: document.getElementById('game-type').value
            };
            
            const response = await fetch('/api/games/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(game)
            });
            
            if (response.ok) {
                alert('Игра отправлена на проверку!');
                document.getElementById('create-game-modal').classList.remove('active');
            }
        }
        
        // Открытие модалки создания бота
        function openCreateBot() {
            document.getElementById('create-bot-modal').classList.add('active');
        }
        
        // Отправка бота на проверку
        async function submitBot() {
            const bot = {
                name: document.getElementById('bot-name').value,
                description: document.getElementById('bot-description').value,
                code: document.getElementById('bot-code').value,
                commands: document.getElementById('bot-commands').value.split(',').map(c => c.trim())
            };
            
            const response = await fetch('/api/bots/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bot)
            });
            
            if (response.ok) {
                alert('Бот отправлен на проверку!');
                document.getElementById('create-bot-modal').classList.remove('active');
            }
        }
        
        // Открытие модалки создания канала
        function openCreateChannel() {
            document.getElementById('create-channel-modal').classList.add('active');
        }
        
        // Создание канала
        async function createChannel() {
            const channel = {
                name: document.getElementById('channel-name').value,
                description: document.getElementById('channel-description').value,
                type: document.getElementById('channel-type').value
            };
            
            const response = await fetch('/api/channels/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(channel)
            });
            
            if (response.ok) {
                alert('Канал создан!');
                document.getElementById('create-channel-modal').classList.remove('active');
                loadChannels();
            }
        }
        
        // Играть в игру
        async function playGame(gameId) {
            const game = games.find(g => g.id === gameId);
            
            // Увеличиваем счетчик игр
            await fetch(`/api/games/${gameId}/play`, { method: 'POST' });
            
            // Здесь можно открыть игру в модальном окне
            alert(`Запуск игры: ${game.name}\n\nВ демо-версии игра не запускается. Код игры:\n${game.code}`);
        }
        
        // Открыть чат с ботом
        function openBotChat(botId) {
            const bot = bots.find(b => b.id === botId);
            alert(`Чат с ботом ${bot.name} будет доступен в следующей версии`);
        }
        
        // Socket.IO слушатели
        socket.on('channel-message', (message) => {
            if (selectedItem) {
                const messagesDiv = document.getElementById('channel-messages');
                if (messagesDiv) {
                    messagesDiv.innerHTML += `
                        <div class="message ${message.userId === currentUser.id ? 'sent' : ''}">
                            <div class="message-header">
                                <span>${message.username}</span>
                                <span>${new Date(message.timestamp).toLocaleTimeString()}</span>
                            </div>
                            <div>${message.text}</div>
                        </div>
                    `;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            }
        });
        
        // Проверяем авторизацию при загрузке
        checkAuth();
    </script>
</body>
</html>
